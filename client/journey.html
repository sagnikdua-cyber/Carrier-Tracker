<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker - Journey Roadmap</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Progress Tracker</div>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="journey.html" class="active">Journey Roadmap</a>
            <a href="syllabus.html">Syllabus</a>
        </div>
        <div class="nav-user">
            <span id="username-display"></span>
            <button id="logout-btn" class="btn btn-secondary btn-sm">Logout</button>
        </div>
    </nav>

    <main class="container">
        <header class="dashboard-header">
            <div class="header-info">
                <h1>Milestone Journey</h1>
                <p>Navigate your timeline block by block, task by task.</p>
            </div>
        </header>

        <div id="journey-loading">Loading your roadmap...</div>
        <div id="journey-error" class="error-message"></div>
        <div id="journey-container" class="journey-tree">
            <!-- Tree UI generated by JS -->
        </div>
    </main>

    <script src="js/journey.js"></script>
    <script src="js/pwa.js"></script>

</html>
